[package]
name = "bpc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
ab_glyph = "0.2.32"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.25", default-features = false }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["full"] }
rusto-rs = "0.4.1"

# OCR inference is CPU-heavy; keep it representative of release performance
# when running the service with `cargo run` during development.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
